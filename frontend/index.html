<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Itinéraires</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>

    <button id="sidebar-toggle">☰</button>
    <div id="sidebar">
        <!-- ===== AFFICHAGE ===== -->
        <section class="panel-section open" data-panel="affichage">
            <h3 class="panel-header">Affichage <span class="chevron">▾</span></h3>
            <div class="panel-body">
                <h4>Fond de carte</h4>
                <div><label><input type="radio" name="base" value="carteNationale" checked> Carte nationale</label></div>
                <div><label><input type="radio" name="base" value="photocarte"> Photocarte</label></div>

                <h4>Couches</h4>
                <div><label><input type="checkbox" id="toggle-wanderwege"> Chemins de randonnée</label></div>
                <div><label><input type="checkbox" id="toggle-points" checked> Points</label></div>
                <div><label><input type="checkbox" id="toggle-routes" checked> Itinéraires</label></div>
            </div>
        </section>

        <!-- ===== POINTS DE VUE ===== -->
        <section class="panel-section" data-panel="points">
            <h3 class="panel-header">Points de vue <span class="chevron">▸</span></h3>
            <div class="panel-body">
                <h4 id="points-list-toggle" style="cursor: pointer;">Liste ▾</h4>
                <ul id="points-list" style="list-style: none; padding: 0; margin: 0;"></ul>

                <h4>Filtres</h4>
                <div id="photo-tag-filters" class="tag-filter-list"></div>
                <div class="date-filter-row">
                    <label>Du <input type="date" id="photo-date-from"></label>
                    <label>au <input type="date" id="photo-date-to"></label>
                    <label><input type="checkbox" id="photo-date-include-unknown" checked> Inclure dates inconnues</label>
                </div>
            </div>
        </section>

        <!-- ===== ITINÉRAIRES ===== -->
        <section class="panel-section" data-panel="itineraires">
            <h3 class="panel-header">Itinéraires <span class="chevron">▸</span></h3>
            <div class="panel-body">
                <div><label>Couleur : <input type="color" id="route-color" value="#3388ff"></label></div>
                <button id="btn-start-route">Commencer l'itinéraire</button>
                <button id="btn-end-route" style="display: none;">Terminer l'itinéraire</button>
                <button id="btn-import-gpx">Importer un GPX</button>
                <ul id="routes-list" style="list-style: none; padding: 0; margin-top: 10px;"></ul>

                <h4>Filtres</h4>
                <div id="route-tag-filters" class="tag-filter-list"></div>
                <div class="stats-filter-row">
                    <div class="stats-filter-row">
                <div class="range-filter">
                    <div class="range-filter-header">
                        <span>Distance</span>
                        <span id="route-dist-label"></span>
                    </div>
                    <div class="dual-range">
                        <div class="dual-range-track"></div>
                        <div class="dual-range-fill" id="route-dist-fill"></div>
                        <input type="range" id="route-dist-min" min="0" max="50" step="0.5" value="0">
                        <input type="range" id="route-dist-max" min="0" max="50" step="0.5" value="50">
                    </div>
                </div>

                <div class="range-filter">
                    <div class="range-filter-header">
                        <span>Durée estimée</span>
                        <span id="route-time-label"></span>
                    </div>
                    <div class="dual-range">
                        <div class="dual-range-track"></div>
                        <div class="dual-range-fill" id="route-time-fill"></div>
                        <input type="range" id="route-time-min" min="0" max="600" step="5" value="0">
                        <input type="range" id="route-time-max" min="0" max="600" step="5" value="600">
                    </div>
                </div>
            </div>
            <div class="stats-filter-row">
                <label>Statut
                    <select id="route-done-status">
                        <option value="all">Tous</option>
                        <option value="done">Faits</option>
                        <option value="todo">Pas encore faits</option>
                    </select>
                </label>
                <label>Fait du <input type="date" id="route-done-from"></label>
                <label>au <input type="date" id="route-done-to"></label>
                <div class="range-filter-header">
                    <span>Durée réelle</span>
                    <span id="route-real-label"></span>
                </div>
                <div class="dual-range">
                    <div class="dual-range-track"></div>
                    <div class="dual-range-fill" id="route-real-fill"></div>
                    <input type="range" id="route-real-min" min="0" max="600" step="5" value="0">
                    <input type="range" id="route-real-max" min="0" max="600" step="5" value="600">
                </div>
            </div>
        </section>
    </div>

    <div id="route-panel" class="hidden">
        <button id="route-panel-close" class="saved-only">✕</button>
        <div id="route-panel-chart"></div>
        <div id="route-panel-info">
            <input type="text" id="route-panel-name" class="route-panel-name-input saved-only">
            <div class="route-panel-stat"><span class="label">Distance</span><span id="route-panel-distance"></span></div>
            <div class="route-panel-stat"><span class="label">Dénivelé +</span><span id="route-panel-gain"></span></div>
            <div class="route-panel-stat"><span class="label">Temps estimé</span><span id="route-panel-time"></span></div>
            <div class="route-panel-stat saved-only">
                <span class="label">Date</span>
                <input type="date" id="route-panel-done-date">
            </div>
            <div class="route-panel-stat saved-only">
                <span class="label">Temps réel</span>
                <span class="real-time-inputs">
                    <input type="number" id="route-panel-real-h" min="0" placeholder="h"> h
                    <input type="number" id="route-panel-real-m" min="0" max="59" placeholder="min"> min
                </span>
            </div>
            <div class="route-panel-stat saved-only"><span class="label">Couleur</span><input type="color" id="route-panel-color"></div>
            <div class="route-panel-stat saved-only"><span class="label">Tags</span></div>
            <div id="route-panel-tags" class="tag-chips saved-only"></div>
            <input type="text" id="route-panel-tag-input" class="tag-add-input saved-only" placeholder="Ajouter un tag + Entrée">
            <button id="route-panel-edit" class="saved-only">✎ Modifier l'itinéraire</button>
            <button id="route-panel-export" class="saved-only">Exporter en GPX</button>
            <button id="route-panel-delete" class="saved-only">Supprimer</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="js/map.js"></script>
    <script src="js/points.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
