<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Itinéraires</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #layer-switcher {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
            background: white;
            padding: 10px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="layer-switcher">
        <div><label><input type="radio" name="base" value="carteNationale" checked> Carte nationale</label></div>
        <div><label><input type="radio" name="base" value="photocarte"> Photocarte</label></div>
        <hr>
        <div><label><input type="checkbox" id="toggle-wanderwege"> Chemins de randonnée</label></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
