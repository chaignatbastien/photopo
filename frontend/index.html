<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Itinéraires</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }

        #sidebar {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 280px;
            background: white;
            box-shadow: -2px 0 6px rgba(0,0,0,0.2);
            font-family: sans-serif;
            font-size: 14px;
            padding: 16px;
            box-sizing: border-box;
            overflow-y: auto;
            transition: transform 0.2s ease;
            z-index: 2;
        }
        #sidebar.collapsed { transform: translateX(280px); }

        #sidebar-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            background: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        #sidebar h3 { margin-top: 0; }
        #sidebar section { margin-bottom: 20px; }

        .point-marker {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #d9534f;
            border: 2px solid white;
            cursor: pointer;
        }
        .point-marker.has-photo { background: #5cb85c; }
        .point-marker.free-point { border-style: dashed; border-color: #333; }

        .point-popup img { max-width: 200px; display: block; margin-bottom: 8px; border-radius: 4px; }
        .point-popup-name { width: 100%; margin-bottom: 8px; font-size: 14px; padding: 4px; box-sizing: border-box; }
        .point-popup button { margin-top: 4px; }
        .photo-placeholder {
            display: flex; align-items: center; justify-content: center;
            width: 80px; height: 80px; border: 2px dashed #999; border-radius: 6px;
            font-size: 28px; color: #999; cursor: pointer; margin-bottom: 8px;
        }
        .photo-placeholder:hover { border-color: #666; color: #666; }
        #points-list li { padding: 4px 0; cursor: pointer; }
        #points-list li:hover { text-decoration: underline; }

        #routes-list li { padding: 4px 0; cursor: pointer; font-weight: bold; }
        #routes-list li:hover { text-decoration: underline; }

        /* ---- Panneau du bas : détails de l'itinéraire sélectionné ---- */
        #route-panel {
            position: absolute;
            left: 0;
            right: 280px;
            bottom: 0;
            height: 220px;
            background: white;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
            display: flex;
            z-index: 2;
            font-family: sans-serif;
            font-size: 14px;
        }
        #route-panel.hidden { display: none; }

        #route-panel-chart {
            flex: 2;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        .elevation-svg { width: 100%; height: 100%; }
        .elevation-area { stroke: none; }
        .elevation-line { fill: none; stroke-width: 2; }
        .elevation-axis-label { font-size: 10px; fill: #666; }
        .route-panel-chart-empty { color: #999; font-style: italic; }

        #route-panel-info {
            flex: 1;
            border-left: 1px solid #ddd;
            padding: 12px 16px;
            box-sizing: border-box;
            overflow-y: auto;
            position: relative;
        }
        .route-panel-name-input {
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-bottom: 1px solid transparent;
            margin-bottom: 10px;
            padding: 2px 0;
            font-family: inherit;
        }
        .route-panel-name-input:hover, .route-panel-name-input:focus {
            border-bottom-color: #999;
            outline: none;
        }
        .route-panel-stat { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .route-panel-stat .label { color: #666; }
        #route-panel-color { border: none; width: 32px; height: 24px; padding: 0; cursor: pointer; vertical-align: middle; }
        #route-panel-close {
            position: absolute; top: 8px; right: 8px;
            border: none; background: none; cursor: pointer; font-size: 16px; color: #999;
        }
        #route-panel-edit, #route-panel-delete {
            display: block; width: 100%; margin-top: 10px; padding: 6px;
        }
        .tag-chip {
            display: inline-block; background: #eee; border-radius: 12px;
            padding: 2px 8px; margin: 2px 4px 2px 0; font-size: 12px; cursor: pointer;
        }
        .tag-chip.active { background: #3388ff; color: white; }
        .tag-add-input { width: 100%; font-size: 12px; padding: 4px; box-sizing: border-box; margin: 4px 0; }
        .tag-filter-list { display: flex; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div id="map"></div>

    <button id="sidebar-toggle">☰</button>
    <div id="sidebar">
        <section>
            <h3>Fond de carte</h3>
            <div><label><input type="radio" name="base" value="carteNationale" checked> Carte nationale</label></div>
            <div><label><input type="radio" name="base" value="photocarte"> Photocarte</label></div>
        </section>

        <section>
            <h3>Couches</h3>
            <div><label><input type="checkbox" id="toggle-wanderwege"> Chemins de randonnée</label></div>
            <div><label><input type="checkbox" id="toggle-points" checked> Points</label></div>
        </section>

        <section>
            <h3 id="points-list-toggle" style="cursor: pointer;">Points ▾</h3>
            <ul id="points-list" style="list-style: none; padding: 0; margin: 0;"></ul>
        </section>

        <section>
            <h3>Filtrer les photos (tags)</h3>
            <div id="photo-tag-filters" class="tag-filter-list"></div>
        </section>

        <section>
            <h3>Itinéraires</h3>
            <div><label>Couleur : <input type="color" id="route-color" value="#3388ff"></label></div>
            <button id="btn-start-route">Commencer l'itinéraire</button>
            <button id="btn-end-route" style="display: none;">Terminer l'itinéraire</button>
            <button id="btn-import-gpx">Importer un GPX</button>
            <ul id="routes-list" style="list-style: none; padding: 0; margin-top: 10px;"></ul>
        </section>

        <section>
            <h3>Filtrer les itinéraires (tags)</h3>
            <div id="route-tag-filters" class="tag-filter-list"></div>
        </section>
        
    </div>

    <div id="route-panel" class="hidden">
        <button id="route-panel-close">✕</button>
        <div id="route-panel-chart"></div>
        <div id="route-panel-info">
            <input type="text" id="route-panel-name" class="route-panel-name-input">
            <div class="route-panel-stat"><span class="label">Distance</span><span id="route-panel-distance"></span></div>
            <div class="route-panel-stat"><span class="label">Dénivelé +</span><span id="route-panel-gain"></span></div>
            <div class="route-panel-stat"><span class="label">Temps estimé</span><span id="route-panel-time"></span></div>
            <div class="route-panel-stat"><span class="label">Couleur</span><input type="color" id="route-panel-color"></div>
            <div class="route-panel-stat"><span class="label">Tags</span></div>
            <div id="route-panel-tags" class="tag-chips"></div>
            <input type="text" id="route-panel-tag-input" class="tag-add-input" placeholder="Ajouter un tag + Entrée">
            <button id="route-panel-edit">✎ Modifier l'itinéraire</button>
            <button id="route-panel-export">Exporter en GPX</button>
            <button id="route-panel-delete">Supprimer</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="js/map.js"></script>
    <script src="js/points.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
